<!DOCTYPE html>
<!--
  DepthWizard frontend — single file, no build step required.

  What this page does:
    1. Lets the user upload a photo.
    2. Sends it to the backend's /predict endpoint (server.py).
    3. Receives back a JSON point cloud (list of 3D points + colors).
    4. Renders that point cloud with Three.js as an interactive 3D scene
       the user can rotate/pan/zoom with the mouse — the "flythrough" demo.

  How to run:
    1. Start the backend first:  python server.py   (from backend/)
    2. Serve this folder, e.g.:  python -m http.server 5500   (from frontend/)
    3. Open http://localhost:5500 in your browser.

  If you open this file directly via file:// instead of a local server,
  most browsers will still allow the fetch() call to localhost:8000 since
  that's a normal cross-origin request (CORS is already enabled server-side),
  but serving it via http.server is the more reliable option.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DepthWizard — 3D Flythrough Demo</title>
  <style>
    /* Keeping styling minimal and inline since this is a single demo file,
       not a production frontend. */
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b0d12;
      color: #eaeaea;
      overflow: hidden;
    }

    #ui-panel {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      background: rgba(20, 22, 28, 0.85);
      padding: 16px 20px;
      border-radius: 10px;
      max-width: 320px;
      backdrop-filter: blur(6px);
    }

    #ui-panel h1 {
      font-size: 16px;
      margin: 0 0 4px 0;
    }

    #ui-panel p {
      font-size: 12px;
      color: #9aa0aa;
      margin: 0 0 12px 0;
      line-height: 1.4;
    }

    #status {
      font-size: 12px;
      margin-top: 10px;
      color: #7fd88f;
      min-height: 16px;
    }

    #status.error {
      color: #ff6b6b;
    }

    input[type="file"] {
      font-size: 12px;
      color: #eaeaea;
    }

    button {
      margin-top: 10px;
      background: #4a7dff;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }

    button:disabled {
      background: #33384a;
      cursor: not-allowed;
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
    }

    #hint {
      position: absolute;
      bottom: 16px;
      left: 16px;
      font-size: 11px;
      color: #6b7280;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div id="ui-panel">
    <h1>DepthWizard</h1>
    <p>Upload a photo. The backend estimates depth and this page renders it
       as an interactive 3D point cloud — drag to rotate, scroll to zoom.</p>
    <input type="file" id="file-input" accept="image/*" />
    <br />
    <button id="generate-btn">Generate 3D View</button>
    <div id="status"></div>
  </div>

  <div id="canvas-container"></div>
  <div id="hint">Left-drag: rotate &nbsp;|&nbsp; Scroll: zoom &nbsp;|&nbsp; Right-drag: pan</div>

  <!-- Three.js from CDN — no npm/build step needed for this demo -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    // -----------------------------------------------------------------
    // Config
    // -----------------------------------------------------------------
    const BACKEND_URL = "http://localhost:8000/predict";

    // -----------------------------------------------------------------
    // Three.js scene setup (runs once on page load)
    // -----------------------------------------------------------------
    const container = document.getElementById("canvas-container");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b0d12);

    const camera = new THREE.PerspectiveCamera(
      60,
      window.innerWidth / window.innerHeight,
      0.1,
      2000
    );
    camera.position.set(0, 0, 150);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    // OrbitControls gives us the "fly around and inspect" interaction —
    // this IS the flythrough experience for v1 (drag to orbit, scroll to
    // zoom, right-drag to pan). A scripted camera-path animation can be
    // layered on top later (see README roadmap).
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;

    // A little ambient light isn't strictly needed since we're using
    // vertex colors (not lit materials), but kept minimal here in case
    // the material is swapped for a lit one later.
    scene.add(new THREE.AmbientLight(0xffffff, 1.0));

    // Track the currently displayed point cloud so we can remove it
    // before adding a new one (otherwise old + new would overlap).
    let currentPointCloud = null;

    function renderLoop() {
      requestAnimationFrame(renderLoop);
      controls.update();
      renderer.render(scene, camera);
    }
    renderLoop();

    // Keep the canvas sized to the window.
    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // -----------------------------------------------------------------
    // Point cloud rendering
    // -----------------------------------------------------------------

    /**
     * Takes the JSON returned by the backend ({ points, colors, count })
     * and builds a Three.js Points object out of it.
     */
    function buildPointCloud(data) {
      const geometry = new THREE.BufferGeometry();

      // Three.js wants flat typed arrays: [x0,y0,z0, x1,y1,z1, ...]
      const positions = new Float32Array(data.count * 3);
      const colors = new Float32Array(data.count * 3);

      for (let i = 0; i < data.count; i++) {
        const [x, y, z] = data.points[i];
        positions[i * 3 + 0] = x;
        positions[i * 3 + 1] = y;
        positions[i * 3 + 2] = z;

        const [r, g, b] = data.colors[i];
        // Three.js vertex colors expect 0-1 floats, backend sends 0-255 ints.
        colors[i * 3 + 0] = r / 255;
        colors[i * 3 + 1] = g / 255;
        colors[i * 3 + 2] = b / 255;
      }

      geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));

      const material = new THREE.PointsMaterial({
        size: 0.9,
        vertexColors: true,
      });

      return new THREE.Points(geometry, material);
    }

    function displayPointCloud(data) {
      if (currentPointCloud) {
        scene.remove(currentPointCloud);
        currentPointCloud.geometry.dispose();
        currentPointCloud.material.dispose();
      }

      const cloud = buildPointCloud(data);
      scene.add(cloud);
      currentPointCloud = cloud;

      // Reset camera to a reasonable distance based on point cloud spread,
      // so the scene is nicely framed regardless of image size/depth_scale.
      camera.position.set(0, 0, 150);
      controls.target.set(0, 0, 0);
      controls.update();
    }

    // -----------------------------------------------------------------
    // Upload + API call wiring
    // -----------------------------------------------------------------
    const fileInput = document.getElementById("file-input");
    const generateBtn = document.getElementById("generate-btn");
    const statusEl = document.getElementById("status");

    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.className = isError ? "error" : "";
    }

    generateBtn.addEventListener("click", async () => {
      const file = fileInput.files[0];
      if (!file) {
        setStatus("Please choose an image first.", true);
        return;
      }

      generateBtn.disabled = true;
      setStatus("Uploading and estimating depth... this can take a few seconds.");

      try {
        const formData = new FormData();
        formData.append("file", file);

        const response = await fetch(BACKEND_URL, {
          method: "POST",
          body: formData,
        });

        if (!response.ok) {
          const errBody = await response.json().catch(() => ({}));
          throw new Error(errBody.detail || `Server returned ${response.status}`);
        }

        const data = await response.json();
        displayPointCloud(data);
        setStatus(`Done — rendered ${data.count.toLocaleString()} points.`);
      } catch (err) {
        console.error(err);
        setStatus(
          `Error: ${err.message}. Is the backend running at ${BACKEND_URL}?`,
          true
        );
      } finally {
        generateBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
